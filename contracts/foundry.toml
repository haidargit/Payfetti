[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Deterministic metadata so the deployed bytecode is reproducible for verification.
bytecode_hash = "none"
cbor_metadata = false

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1024

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "params_first"
sort_imports = true

# Arc networks.
[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"

[etherscan]
arc = {key = "unused", url = "https://explorer.arc.io/api", chain = 5042}
arc_testnet = {key = "unused", url = "https://testnet.arcscan.app/api", chain = 5042002}
