<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Payfetti | pay hundreds of people in one transaction</title>
    <meta
      name="description"
      content="Pay hundreds of people tiny amounts of USDC in one Arc transaction, for about a tenth of a cent each, with a receipt every payee can verify themselves."
    />
    <!-- PNGs first and without `sizes="any"`: that attribute declares an icon
         good at every size, which makes a browser prefer the .ico over these and
         is how a stale .ico kept winning. The .ico stays last, for old browsers
         that cannot read a PNG favicon. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f8f9fc" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Payfetti" />
    <meta property="og:title" content="Pay everyone at once" />
    <meta
      property="og:description"
      content="Pay hundreds of people in one transaction for about a tenth of a cent each, and give every one of them a receipt they can check themselves."
    />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pay everyone at once" />
    <meta
      name="twitter:description"
      content="Pay hundreds of people in one transaction for about a tenth of a cent each, on Arc."
    />
    <meta name="twitter:image" content="/android-chrome-512x512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
